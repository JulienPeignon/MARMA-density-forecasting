line-length = 88
# Only the repository root is a first-party root, so an untracked src/<name>/
# cannot masquerade as a top-level module and reorder imports differently
# between checkouts.
src = ["."]

[lint]
select = ["E", "W", "F", "I", "D"]

[lint.isort]
known-first-party = ["src"]

[lint.pydocstyle]
convention = "pep257"

[lint.per-file-ignores]
# Vendored from dms_variants; keep the upstream docstrings as they are.
"src/calibration/ispline.py" = ["D"]
